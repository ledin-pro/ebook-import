[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pro-ledin-ebook-import"
version = "0.2.0"
description = "Deterministic EPUB, FB2, and MOBI-family importer for AI-agent-readable Markdown corpora."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mxl" }]
keywords = ["epub", "fb2", "mobi", "azw3", "obsidian", "markdown", "ebooks", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
dev = ["hypothesis>=6.0", "jsonschema>=4.25,<5", "pytest>=8.0", "pytest-cov>=6.0"]

[project.scripts]
ebook-import = "pro.ledin.ebook_import.core:main"

[project.urls]
Homepage = "https://github.com/ledin-pro/ebook-import"
Repository = "https://github.com/ledin-pro/ebook-import"

[tool.hatch.build.targets.wheel]
packages = ["src/pro"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pro",
    "tests",
    "evals",
    "schemas",
    "skills/ebook-import/SKILL.md",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["external: requires real mobitool and Calibre executables"]
